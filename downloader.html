<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Video Downloader | Sadik Tool's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02040a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #bg-glow-ball {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(147, 51, 234, 0.25) 50%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(50px);
            left: -500px;
            top: -500px;
            transition: transform 0.05s ease-out;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }
        .platform-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .platform-btn:hover, .platform-btn.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(96, 165, 250, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .btn-action {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            transition: all 0.25s ease;
        }
        .btn-action:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .btn-action:active { transform: scale(0.96); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .custom-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <canvas id="bg-canvas"></canvas>
    <div id="bg-glow-ball"></div>

    <!-- Header -->
    <header class="glass-card rounded-2xl p-4 mb-6 flex justify-between items-center max-w-6xl mx-auto w-full relative z-10">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">📥</span>
            <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">Sadik Video Downloader</h1>
        </div>
        <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-medium transition active:scale-95 border border-white/10">← Back Home</a>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-xl mx-auto w-full mb-12 relative z-10 space-y-6">

        <!-- Platform Selection Cards -->
        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-6 text-center">
            <div class="text-3xl">🎬</div>
            <h2 class="text-2xl font-bold bg-gradient-to-r from-blue-300 to-indigo-300 bg-clip-text text-transparent">Select Platform & Download</h2>
            <p class="text-gray-400 text-xs md:text-sm">নিচে থেকে প্ল্যাটফর্ম সিলেক্ট করে ভিডিওর লিংক পেস্ট করুন।</p>

            <!-- Platform Buttons Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button type="button" onclick="selectPlatform('youtube', this)" class="platform-btn active p-3 rounded-2xl flex flex-col items-center space-y-1.5 cursor-pointer">
                    <span class="text-2xl">🔴</span>
                    <span class="text-xs font-semibold text-white">YouTube</span>
                </button>
                <button type="button" onclick="selectPlatform('tiktok', this)" class="platform-btn p-3 rounded-2xl flex flex-col items-center space-y-1.5 cursor-pointer">
                    <span class="text-2xl">⚫</span>
                    <span class="text-xs font-semibold text-white">TikTok</span>
                </button>
                <button type="button" onclick="selectPlatform('instagram', this)" class="platform-btn p-3 rounded-2xl flex flex-col items-center space-y-1.5 cursor-pointer">
                    <span class="text-2xl">🟣</span>
                    <span class="text-xs font-semibold text-white">Instagram</span>
                </button>
                <button type="button" onclick="selectPlatform('facebook', this)" class="platform-btn p-3 rounded-2xl flex flex-col items-center space-y-1.5 cursor-pointer">
                    <span class="text-2xl">🔵</span>
                    <span class="text-xs font-semibold text-white">Facebook</span>
                </button>
            </div>

            <!-- Input & Fetch Button -->
            <div class="space-y-3 pt-2">
                <input type="url" id="video-url" placeholder="এখানে ভিডিওর লিংক দিন (https://...)" class="w-full custom-input rounded-xl px-4 py-3.5 text-white text-sm">
                <button id="fetch-btn" onclick="fetchVideoWithApify()" class="btn-action w-full py-3.5 rounded-xl font-bold text-white shadow-lg text-sm">Fetch & Generate Download</button>
            </div>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="glass-card rounded-3xl p-6 hidden space-y-4 text-center">
            <div id="result-content" class="space-y-3">
                <!-- Dynamic Results -->
            </div>
        </div>

    </main>

    <footer class="text-center text-gray-500 text-xs py-4 relative z-10">
        <p>© 2026 Sadik Tool's • Powered by Apify API</p>
    </footer>

    <script>
        let selectedPlatform = 'youtube';

        function selectPlatform(platform, btnElement) {
            selectedPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const inputField = document.getElementById('video-url');
            if (platform === 'youtube') inputField.placeholder = "YouTube লিংক দিন (https://youtube.com/...)";
            else if (platform === 'tiktok') inputField.placeholder = "TikTok লিংক দিন (https://tiktok.com/...)";
            else if (platform === 'instagram') inputField.placeholder = "Instagram Reeling লিংক দিন...";
            else if (platform === 'facebook') inputField.placeholder = "Facebook ভিডিও লিংক দিন...";
        }

        async function fetchVideoWithApify() {
            const urlInput = document.getElementById('video-url').value.trim();
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');
            const fetchBtn = document.getElementById('fetch-btn');

            if (!urlInput) {
                alert('দয়া করে প্রথমে একটি ভিডিওর লিংক দিন!');
                return;
            }

            fetchBtn.disabled = true;
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = `
                <div class="text-3xl animate-bounce">⏳</div>
                <h3 class="text-base font-bold text-amber-400">Apify সার্ভার প্রসেস করছে...</h3>
                <p class="text-xs text-gray-300">ভিডিওর ডেটা সংগ্রহ করতে ১০-১৫ সেকেন্ড সময় লাগতে পারে।</p>
            `;

            const API_TOKEN = 'apify_api_5pMYXnDPwTtgqUKJ4gm8o95S78oOjf0SoxNg';
            const ACTOR_ID = 'wilcode~all-social-media-video-downloader';
            const endpoint = `https://api.apify.com/v2/acts/${ACTOR_ID}/run-sync-get-dataset-items?token=${API_TOKEN}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: urlInput,
                        proxySettings: {
                            useApifyProxy: true,
                            apifyProxyGroups: ["RESIDENTIAL"],
                            apifyProxyCountry: "CA"
                        },
                        mergeAV: false
                    })
                });

                if (!response.ok) throw new Error('Apify API রিকোয়েস্ট ব্যর্থ হয়েছে।');

                const items = await response.json();
                
                if (items && items.length > 0) {
                    renderApifyResults(items[0], urlInput);
                } else {
                    throw new Error('কোনো মিডিয়া ডেটা পাওয়া যায়নি।');
                }
            } catch (err) {
                console.error(err);
                // Safe Fallback Redirect if API takes time or blocks
                resultContent.innerHTML = `
                    <div class="text-3xl">🚀</div>
                    <h3 class="text-base font-bold text-blue-400">ডাইরেক্ট ডাউনলোড হাব</h3>
                    <p class="text-xs text-gray-300 mb-2">সার্ভার থেকে সরাসরি ফেচ করতে সমস্যা হলে নিচের লিংকে ক্লিক করুন:</p>
                    <a href="https://en.savefrom.net/#url=${encodeURIComponent(urlInput)}" target="_blank" rel="noopener"
                       class="platform-btn block w-full py-3.5 rounded-xl font-bold text-white text-sm bg-blue-600 shadow-lg">
                       📥 Open Fast Download Server
                    </a>
                `;
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function renderApifyResults(item, originalUrl) {
            const resultContent = document.getElementById('result-content');
            let downloadUrl = item.url || item.videoUrl || item.downloadUrl || originalUrl;
            let title = item.title || "Social Media Video";
            let thumb = item.thumbnail || item.thumb || "";

            let thumbHtml = thumb ? `<img src="${thumb}" class="w-full h-36 object-cover rounded-xl mb-3">` : '';

            resultContent.innerHTML = `
                <div class="text-3xl">✅</div>
                <h3 class="text-base font-bold text-emerald-400">ভিডিও সফলভাবে প্রস্তুত!</h3>
                ${thumbHtml}
                <p class="text-xs text-gray-300 font-medium line-clamp-2 px-1">${escapeHtml(title)}</p>
                <a href="${downloadUrl}" target="_blank" rel="noopener" download
                   class="platform-btn block w-full py-3.5 rounded-xl font-bold text-white text-sm bg-gradient-to-r from-emerald-600 to-teal-600 shadow-lg mt-2">
                   ⬇️ Download Video File Now
                </a>
            `;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Background Particle & Glow Animation Script
        const glowBall = document.getElementById('bg-glow-ball');
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 220 };

        function updatePointer(x, y) {
            pointer.x = x;
            pointer.y = y;
            if (glowBall) {
                glowBall.style.left = x + 'px';
                glowBall.style.top = y + 'px';
            }
        }

        window.addEventListener('mousemove', (e) => { updatePointer(e.clientX, e.clientY); });
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener('touchstart', (e) => { if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        const particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.8,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                color: Math.random() > 0.4 ? 'rgba(96, 165, 250, 0.7)' : 'rgba(167, 139, 250, 0.7)'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                let dx = pointer.x - p.x;
                let dy = pointer.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < pointer.radius) {
                    let cacheForce = (pointer.radius - distance) / pointer.radius;
                    p.x += (dx / distance) * cacheForce * 3.5;
                    p.y += (dy / distance) * cacheForce * 3.5;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(96, 165, 250, ${cacheForce * 0.35})`;
                    ctx.lineWidth = 0.8;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(pointer.x, pointer.y);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#60a5fa';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
