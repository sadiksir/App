<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Video Downloader | Sadik Tool's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02040a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #bg-glow-ball {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(147, 51, 234, 0.2) 50%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(40px);
            left: -500px;
            top: -500px;
            transition: transform 0.05s ease-out;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }
        .btn-action {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            transition: all 0.2s ease;
        }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <canvas id="bg-canvas"></canvas>
    <div id="bg-glow-ball"></div>

    <!-- Header -->
    <header class="glass-card rounded-2xl p-4 mb-8 flex justify-between items-center max-w-6xl mx-auto w-full relative z-10">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">📥</span>
            <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">YTDown Stream Hub</h1>
        </div>
        <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-medium transition active:scale-95">← Back Home</a>
    </header>

    <!-- Main Downloader Workspace -->
    <main class="max-w-2xl mx-auto w-full mb-12 relative z-10 space-y-6">

        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-6 text-center">
            <div class="text-4xl mb-2">🎬</div>
            <h2 class="text-2xl font-bold bg-gradient-to-r from-blue-300 to-indigo-300 bg-clip-text text-transparent">Multi-Quality Video Downloader</h2>
            <p class="text-gray-400 text-sm">যেকোনো সোশ্যাল মিডিয়া বা ইউটিউব লিংক পেস্ট করে কোয়ালিটি বেছে নিন।</p>
            
            <div class="flex flex-col md:flex-row gap-3">
                <input type="url" id="video-url" placeholder="ভিডিওর লিংক এখানে পেস্ট করুন (https://...)" class="flex-1 bg-black/40 border border-white/15 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-blue-400">
                <button onclick="fetchVideoQualities()" class="btn-action px-6 py-3.5 rounded-xl font-bold text-white shadow-lg">Fetch Quality</button>
            </div>
        </div>

        <!-- Quality Selection Modal / Box (Like Screenshot) -->
        <div id="result-box" class="glass-card rounded-3xl p-6 hidden space-y-4">
            <div class="flex items-center space-x-4 border-b border-white/10 pb-4">
                <div id="video-thumb" class="w-20 h-20 bg-black/50 rounded-xl overflow-hidden flex items-center justify-center text-xl flex-shrink-0">📺</div>
                <div>
                    <h3 id="video-title" class="text-sm font-semibold text-white line-clamp-2">ভিডিওর নাম লোড হচ্ছে...</h3>
                    <p class="text-xs text-emerald-400 mt-1">● কোয়ালিটি সিলেক্ট করুন</p>
                </div>
            </div>

            <!-- Options List Container -->
            <div id="quality-list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                <!-- Dynamic Quality Radio Items will appear here -->
            </div>
        </div>

    </main>

    <footer class="text-center text-gray-500 text-xs py-4 relative z-10">
        <p>© 2026 Sadik Tool's • High-Speed Downloader</p>
    </footer>

    <script>
        async function fetchVideoQualities() {
            const urlInput = document.getElementById('video-url').value.trim();
            const resultBox = document.getElementById('result-box');
            const videoTitle = document.getElementById('video-title');
            const videoThumb = document.getElementById('video-thumb');
            const qualityList = document.getElementById('quality-list');

            if (!urlInput) {
                alert('দয়া করে প্রথমে একটি লিংক দিন!');
                return;
            }

            resultBox.classList.remove('hidden');
            videoTitle.innerText = "সার্ভার থেকে ভিডিওর তথ্য সংগ্রহ করা হচ্ছে...";
            qualityList.innerHTML = `<p class="text-yellow-400 text-xs animate-pulse text-center py-4">বিভিন্ন রেজুলেশন ও অডিও ফরম্যাট খোঁজা হচ্ছে...</p>`;

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        vQuality: 'max',
                        filenamePattern: 'classic'
                    })
                });

                const data = await response.json();

                if (data.status === 'redirect' || data.status === 'stream' || data.url) {
                    const dlUrl = data.url || data.stream;
                    videoTitle.innerText = data.filename || "Sadik Stream Video";
                    videoThumb.innerHTML = `<img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200&auto=format&fit=crop&q=60" class="w-full h-full object-cover">`;
                    
                    qualityList.innerHTML = `
                        <a href="${dlUrl}" target="_blank" class="flex items-center justify-between p-3.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-sm font-medium transition">
                            <span class="text-white">MP4 - (HD Video Stream)</span>
                            <span class="w-5 h-5 rounded-full border-2 border-amber-400 flex items-center justify-center p-0.5"><span class="w-full h-full bg-amber-400 rounded-full"></span></span>
                        </a>
                    `;
                } else if (data.status === 'picker') {
                    videoTitle.innerText = data.filename || "Social Media Video";
                    videoThumb.innerHTML = data.thumbnail ? `<img src="${data.thumbnail}" class="w-full h-full object-cover">` : `🎬`;
                    
                    let htmlContent = '';
                    
                    data.picker.forEach((item) => {
                        let labelText = item.type === 'audio' ? `Audio - (${item.audioFormat || 'MP3'})` : `MP4 - (${item.quality || 'HD'})`;
                        
                        htmlContent += `
                            <a href="${item.url}" target="_blank" class="flex items-center justify-between p-3.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-sm font-medium transition">
                                <span class="text-white">${labelText}</span>
                                <span class="w-5 h-5 rounded-full border-2 border-amber-400 flex items-center justify-center"></span>
                            </a>
                        `;
                    });
                    
                    qualityList.innerHTML = htmlContent;
                } else {
                    throw new Error('Failed');
                }
            } catch (error) {
                // Fallback direct redirection box if API blocks
                videoTitle.innerText = "ডাউনলোড সার্ভার হাব";
                videoThumb.innerHTML = `🚀`;
                qualityList.innerHTML = `
                    <p class="text-xs text-gray-300 mb-2">সরাসরি ফেচ করতে সমস্যা হলে নিচের হাই-স্পিড সার্ভার ব্যবহার করুন:</p>
                    <a href="https://en.savefrom.net/#url=${encodeURIComponent(urlInput)}" target="_blank" class="block w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-center font-bold text-white transition">📥 Open Fast Download Server</a>
                `;
            }
        }

        // Background Animation Script
        const glowBall = document.getElementById('bg-glow-ball');
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 200 };

        function updatePointer(x, y) {
            pointer.x = x;
            pointer.y = y;
            if (glowBall) {
                glowBall.style.left = x + 'px';
                glowBall.style.top = y + 'px';
            }
        }

        window.addEventListener('mousemove', (e) => { updatePointer(e.clientX, e.clientY); });
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener('touchstart', (e) => { if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        const particles = [];
        for (let i = 0; i < 140; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.8 + 1,
                vx: (Math.random() - 0.5) * 0.9,
                vy: (Math.random() - 0.5) * 0.9,
                color: Math.random() > 0.4 ? 'rgba(96, 165, 250, 0.8)' : 'rgba(167, 139, 250, 0.8)'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

                let dx = pointer.x - p.x;
                let dy = pointer.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < pointer.radius) {
                    let cacheForce = (pointer.radius - distance) / pointer.radius;
                    p.x += (dx / distance) * cacheForce * 4;
                    p.y += (dy / distance) * cacheForce * 4;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(96, 165, 250, ${cacheForce * 0.4})`;
                    ctx.lineWidth = 0.9;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(pointer.x, pointer.y);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#60a5fa';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
