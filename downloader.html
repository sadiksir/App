<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Video Downloader | Sadik Tool's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02040a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #bg-glow-ball {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(147, 51, 234, 0.25) 50%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(50px);
            left: -500px;
            top: -500px;
            transition: transform 0.05s ease-out;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
            box-shadow: 0 16px 48px 0 rgba(59, 130, 246, 0.25);
        }
        .btn-action {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            transition: all 0.25s ease;
        }
        .btn-action:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
        }
        .btn-action:active { transform: scale(0.96); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .custom-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
            outline: none;
        }
        .quality-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .quality-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(96, 165, 250, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <canvas id="bg-canvas"></canvas>
    <div id="bg-glow-ball"></div>

    <!-- Header -->
    <header class="glass-card rounded-2xl p-4 mb-8 flex justify-between items-center max-w-6xl mx-auto w-full relative z-10">
        <div class="flex items-center space-x-3">
            <span class="text-2xl animate-pulse">📥</span>
            <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">Sadik Video Downloader</h1>
        </div>
        <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-medium transition active:scale-95 border border-white/10">← Back Home</a>
    </header>

    <!-- Main Downloader Workspace -->
    <main class="max-w-xl mx-auto w-full mb-12 relative z-10 space-y-6">

        <!-- Instance Settings Toggle Box -->
        <div class="glass-card rounded-3xl p-4 md:p-5 space-y-2">
            <button type="button" onclick="toggleSettings()" class="w-full flex justify-between items-center text-xs text-gray-400 font-semibold hover:text-white transition">
                <span>⚙️ সার্ভার ইনস্ট্যান্স সেটিংস (Auto-Fallback Active)</span>
                <span id="settings-caret">▸</span>
            </button>
            <div id="settings-body" class="space-y-3 pt-2 hidden">
                <div>
                    <label class="text-[11px] text-gray-400 block mb-1">Primary Cobalt Instance URL</label>
                    <input type="url" id="instance-url" value="https://cobalt.meowing.de" class="w-full custom-input rounded-xl px-3 py-2.5 text-white text-xs">
                </div>
                <button type="button" onclick="saveInstanceSettings()" class="w-full py-2.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-semibold transition">সেভ করো</button>
            </div>
        </div>

        <!-- Link Input Box -->
        <div class="glass-card rounded-3xl p-6 md:p-8 space-y-5 text-center">
            <div class="text-4xl mb-1">🎬</div>
            <h2 class="text-2xl font-bold bg-gradient-to-r from-blue-300 to-indigo-300 bg-clip-text text-transparent">Media Downloader Hub</h2>
            <p class="text-gray-400 text-xs md:text-sm">ইউটিউব, টিকটক, ইনস্টাগ্রাম বা ফেসবুক লিংক পেস্ট করে কোয়ালিটি বেছে নিন।</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="text-left">
                    <label class="text-[11px] text-gray-400 block mb-1">ভিডিও রেজুলেশন</label>
                    <select id="video-quality" class="w-full custom-input rounded-xl px-3 py-3 text-white text-xs">
                        <option value="1080" selected>1080p (Full HD)</option>
                        <option value="720">720p (HD)</option>
                        <option value="480">480p (SD)</option>
                        <option value="360">360p</option>
                    </select>
                </div>
                <div class="text-left">
                    <label class="text-[11px] text-gray-400 block mb-1">ডাউনলোড ফরম্যাট</label>
                    <select id="download-mode" class="w-full custom-input rounded-xl px-3 py-3 text-white text-xs">
                        <option value="auto" selected>ভিডিও + অডিও (MP4)</option>
                        <option value="audio">শুধুমাত্র অডিও (MP3)</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-1">
                <input type="url" id="video-url" placeholder="ভিডিওর লিংক এখানে পেস্ট করুন (https://...)" class="flex-1 custom-input rounded-xl px-4 py-3.5 text-white text-sm">
                <button id="fetch-btn" onclick="fetchVideoWithAutoFallback()" class="btn-action px-6 py-3.5 rounded-xl font-bold text-white shadow-lg text-sm whitespace-nowrap">Fetch Media</button>
            </div>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="glass-card rounded-3xl p-6 hidden space-y-4 text-center">
            <div id="result-content" class="space-y-3">
                <!-- Dynamic Results -->
            </div>
        </div>

    </main>

    <footer class="text-center text-gray-500 text-xs py-4 relative z-10">
        <p>© 2026 Sadik Tool's • Built with Advanced Auto-Fallback Engine</p>
    </footer>

    <script>
        const fetchBtn = document.getElementById('fetch-btn');
        const settingsBody = document.getElementById('settings-body');
        const settingsCaret = document.getElementById('settings-caret');

        function toggleSettings() {
            settingsBody.classList.toggle('hidden');
            settingsCaret.textContent = settingsBody.classList.contains('hidden') ? '▸' : '▾';
        }

        function loadInstanceSettings() {
            try {
                const savedUrl = localStorage.getItem('cobalt_instance_url');
                document.getElementById('instance-url').value = savedUrl || 'https://cobalt.meowing.de';
            } catch (e) {}
        }
        function saveInstanceSettings() {
            try {
                localStorage.setItem('cobalt_instance_url', document.getElementById('instance-url').value.trim());
            } catch (e) {}
            toggleSettings();
            alert('ইনস্ট্যান্স সফলভাবে সেভ হয়েছে!');
        }
        loadInstanceSettings();

        // Multi-Instance Fallback List for 100% Reliability
        function getCandidateInstances() {
            let customUrl = document.getElementById('instance-url').value.trim().replace(/\/+$/, '');
            let list = [
                customUrl,
                'https://cobalt.meowing.de',
                'https://co.wuk.sh',
                'https://cobalt.k8s.in.th'
            ];
            // Remove duplicates and empty strings
            return [...new Set(list)].filter(Boolean);
        }

        async function fetchVideoWithAutoFallback() {
            const urlInput = document.getElementById('video-url').value.trim();
            const quality = document.getElementById('video-quality').value;
            const mode = document.getElementById('download-mode').value;
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');

            if (!urlInput) {
                alert('দয়া করে প্রথমে একটি ভিডিওর লিংক দিন!');
                return;
            }

            fetchBtn.disabled = true;
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = `
                <div class="text-3xl animate-bounce">⏳</div>
                <h3 class="text-base font-bold text-amber-400">একাধিক সার্ভার ট্রাই করা হচ্ছে...</h3>
                <p class="text-xs text-gray-300">দয়া করে কয়েক সেকেন্ড অপেক্ষা করুন।</p>
            `;

            const instances = getCandidateInstances();
            let successData = null;

            for (let instanceUrl of instances) {
                try {
                    const res = await fetch(instanceUrl + '/', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url: urlInput,
                            videoQuality: quality,
                            downloadMode: mode,
                            filenameStyle: 'pretty'
                        })
                    });

                    if (res.ok) {
                        const data = await res.json().catch(() => null);
                        if (data && data.status) {
                            successData = data;
                            break; // Success! Exit loop.
                        }
                    }
                } catch (err) {
                    console.warn(`Instance failed: ${instanceUrl}`, err);
                    // Continue to next instance in loop
                }
            }

            fetchBtn.disabled = false;

            if (successData) {
                renderResult(successData, urlInput);
            } else {
                // Ultimate Fallback: Direct safe engine redirect button if all instances block
                resultContent.innerHTML = `
                    <div class="text-3xl">🚀</div>
                    <h3 class="text-base font-bold text-blue-400">ডাইরেক্ট ডাউনলোড হাব</h3>
                    <p class="text-xs text-gray-300 mb-2">সার্ভার ব্যস্ত থাকায় নিচের হাই-স্পিড সার্ভার থেকে এক ক্লিকে ডাউনলোড করুন:</p>
                    <a href="https://en.savefrom.net/#url=${encodeURIComponent(urlInput)}" target="_blank" rel="noopener"
                       class="quality-btn block w-full py-3.5 rounded-xl font-bold text-white text-sm bg-gradient-to-r from-blue-600 to-indigo-600 shadow-lg">
                       📥 Open Fast Download Server
                    </a>
                `;
            }
        }

        function renderResult(data, originalUrl) {
            const resultContent = document.getElementById('result-content');

            if (data.status === 'error') {
                const code = data.error && data.error.code ? data.error.code : 'unknown';
                resultContent.innerHTML = `
                    <div class="text-3xl">⚠️</div>
                    <h3 class="text-base font-bold text-amber-400">ভিডিও প্রসেস করা যায়নি</h3>
                    <p class="text-xs text-gray-300 break-all">কোড: ${escapeHtml(code)}</p>
                    <p class="text-xs text-gray-500 mt-1">লিংকটি সঠিক বা পাবলিক আছে কিনা নিশ্চিত করুন।</p>
                `;
                return;
            }

            if (data.status === 'redirect' || data.status === 'tunnel') {
                resultContent.innerHTML = `
                    <div class="text-3xl">✅</div>
                    <h3 class="text-base font-bold text-emerald-400">ডাউনলোড লিংক তৈরি হয়েছে!</h3>
                    <p class="text-xs text-gray-400 truncate px-2">সোর্স: ${escapeHtml(originalUrl)}</p>
                    <a href="${data.url}" target="_blank" rel="noopener" download="${escapeHtml(data.filename || 'media')}"
                       class="quality-btn block w-full py-3.5 rounded-xl font-bold text-white text-sm bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-lg transition">
                       ⬇️ Download File Now (${escapeHtml(data.filename || 'HD Video/Audio')})
                    </a>
                `;
                return;
            }

            if (data.status === 'picker' && Array.isArray(data.picker)) {
                const items = data.picker.map((p, i) => `
                    <a href="${p.url}" target="_blank" rel="noopener" download
                       class="quality-btn block w-full py-3 rounded-xl font-semibold text-white text-sm">
                       ⬇️ কোয়ালিটি অপশন ${i + 1} (${escapeHtml(p.type || 'Media')})
                    </a>
                `).join('');
                resultContent.innerHTML = `
                    <div class="text-3xl">✅</div>
                    <h3 class="text-base font-bold text-emerald-400">একাধিক ফরম্যাট পাওয়া গেছে</h3>
                    <div class="space-y-2 pt-2">${items}</div>
                `;
                return;
            }

            resultContent.innerHTML = `
                <div class="text-3xl">✨</div>
                <h3 class="text-base font-bold text-blue-400">ফাইল প্রস্তুত</h3>
                <a href="${data.url || originalUrl}" target="_blank" rel="noopener"
                   class="quality-btn block w-full py-3.5 rounded-xl font-bold text-white text-sm bg-blue-600 shadow-lg">
                   📥 Download Media
                </a>
            `;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Background Particle & Glow Animation Script
        const glowBall = document.getElementById('bg-glow-ball');
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 220 };

        function updatePointer(x, y) {
            pointer.x = x;
            pointer.y = y;
            if (glowBall) {
                glowBall.style.left = x + 'px';
                glowBall.style.top = y + 'px';
            }
        }

        window.addEventListener('mousemove', (e) => { updatePointer(e.clientX, e.clientY); });
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        window.addEventListener('touchstart', (e) => { if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        const particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.8,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                color: Math.random() > 0.4 ? 'rgba(96, 165, 250, 0.7)' : 'rgba(167, 139, 250, 0.7)'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                let dx = pointer.x - p.x;
                let dy = pointer.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < pointer.radius) {
                    let cacheForce = (pointer.radius - distance) / pointer.radius;
                    p.x += (dx / distance) * cacheForce * 3.5;
                    p.y += (dy / distance) * cacheForce * 3.5;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(96, 165, 250, ${cacheForce * 0.35})`;
                    ctx.lineWidth = 0.8;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(pointer.x, pointer.y);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#60a5fa';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
